# Local development stack:  docker compose up -d --build
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/api/docs
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: stock-monitor

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stock}:${POSTGRES_PASSWORD:-stock}@postgres:5432/${POSTGRES_DB:-stock}
    REDIS_URL: redis://redis:6379/0
    LOG_DIR: /app/logs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock}
      POSTGRES_DB: ${POSTGRES_DB:-stock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Not published to the host. Use `docker compose exec postgres psql ...` for access.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    <<: *backend-env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stock}:${POSTGRES_PASSWORD:-stock}@postgres:5432/${POSTGRES_DB:-stock}
      REDIS_URL: redis://redis:6379/0
      LOG_DIR: /app/logs
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - applogs:/app/logs
    restart: unless-stopped

  worker:
    build: ./backend
    <<: *backend-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - applogs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # Optional locally (`docker compose --profile nginx up -d`): same routing as production on :8080
  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  redisdata:
  applogs:
