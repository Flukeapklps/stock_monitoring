# Free daily mode: analyze after the US close, publish a static dashboard to GitHub Pages,
# and send ONE LINE message with tomorrow's plan.
# Setup: docs/GITHUB_PAGES_FREE_MODE.md
name: Daily snapshot

on:
  schedule:
    # 22:15 UTC Mon-Fri = after the 16:00 ET close in both EST and EDT. Holidays are skipped by the script.
    - cron: "15 22 * * 1-5"
    # Backup run (Tue-Sat 01:30 UTC): Yahoo sometimes publishes the final daily bar late.
    # Sends only if the first run did not (send-once guard), with whatever data is valid.
    - cron: "30 1 * * 2-6"
  workflow_dispatch:
    inputs:
      force_line:
        description: "Send the LINE message even if this session was already sent"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # If Pages is not enabled yet (Settings -> Pages -> Source: GitHub Actions), keep going:
      # the snapshot and the LINE message still run; only the website deploy is skipped.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      # Run state (last session analysed / LINE sent) is kept in the Actions cache, so the
      # send-once guard works even when Pages is not enabled. The live site, if any, wins.
      - name: Restore previous snapshot state
        uses: actions/cache/restore@v4
        with:
          path: previous.json
          key: snapshot-state-${{ github.run_id }}
          restore-keys: snapshot-state-

      - name: Fetch previous snapshot from the live site
        if: steps.pages.outcome == 'success'
        run: |
          if curl -fsS "${{ steps.pages.outputs.base_url }}/data/latest.json" -o prev.tmp; then mv prev.tmp previous.json; else echo "no published snapshot yet"; fi

      - name: Build snapshot and notify
        working-directory: backend
        env:
          ENVIRONMENT: snapshot
          # SEC requires contact info: set repository variable SEC_USER_AGENT="StockMonitor/1.0 you@example.com"
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: >
          python -m app.snapshot --config ../snapshot.config.json --out ../site/data --previous ../previous.json
          ${{ inputs.force_line && '--force-line' || '' }}
          ${{ github.event.schedule == '30 1 * * 2-6' && '--min-ok-ratio 0' || '' }}

      - name: Save snapshot state
        if: always()
        run: if [ -f site/data/latest.json ]; then cp site/data/latest.json previous.json; fi

      - uses: actions/cache/save@v4
        if: always() && hashFiles('previous.json') != ''
        with:
          path: previous.json
          key: snapshot-state-${{ github.run_id }}

      # Artifact name includes the attempt number: a "Re-run" of the same run would
      # otherwise upload a second "github-pages" artifact and deploy-pages refuses it.
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Pages not enabled
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled. Settings -> Pages -> Build and deployment -> Source: GitHub Actions. The snapshot ran and LINE was handled; only the website was not published."

      - name: Report LINE failure
        if: always()
        run: |
          if [ -f line_error.txt ]; then echo "::error::$(cat line_error.txt)"; exit 1; fi
