# Keeps scheduled workflows running. GitHub disables schedules in public repositories after
# 60 days without repository activity; re-enabling them through the API resets that timer.
# No commits are made.
name: Keep schedules alive

on:
  schedule:
    # 1st and 20th of each month (< 60-day gap), 03:17 UTC to avoid top-of-hour congestion
    - cron: "17 3 1,20 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in daily-snapshot.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              && echo "enabled $wf"
          done
