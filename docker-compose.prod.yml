# Production overrides (Linux VPS / Ubuntu / cloud VM):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only Nginx is published (80/443). PostgreSQL, Redis, API and frontend stay on the
# internal Docker network.
services:
  postgres:
    restart: always
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    restart: always
    logging: *logging

  backend:
    restart: always
    ports: !reset []
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stock}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stock}
      REDIS_URL: redis://redis:6379/0
      LOG_DIR: /app/logs
      RUN_MIGRATIONS: "true"
    volumes:
      - ./logs/backend:/app/logs
    logging: *logging

  worker:
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stock}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stock}
      REDIS_URL: redis://redis:6379/0
      LOG_DIR: /app/logs
    volumes:
      - ./logs/worker:/app/logs
    logging: *logging

  frontend:
    restart: always
    ports: !reset []
    logging: *logging

  nginx:
    profiles: !reset []
    restart: always
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./logs/nginx:/var/log/nginx
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports: !override
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
    logging: *logging

  certbot:
    image: certbot/certbot:v3.0.1
    profiles: ["certbot"]
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: always

volumes:
  certbot-webroot:
  certbot-certs:
